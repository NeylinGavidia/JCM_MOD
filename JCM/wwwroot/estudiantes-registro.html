<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar estudiante - I.E. José Carlos Mariátegui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body data-page="matricula">
    <main class="content" id="contenido">
        <div class="page-shell">
            <div class="module-title-row">
                <div class="module-copy">
                    <h2>Registrar nuevo estudiante</h2>
                    <p>Completa los datos del estudiante y define el grado y sección para su matrícula.</p>
                </div>
                <div class="header-actions">
                    <a class="btn btn-sec" href="matricula.html"><span class="material-symbols-outlined">arrow_back</span>Volver al padrón</a>
                </div>
            </div>

            <section class="form-card">
                <form id="form-estudiante" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label for="estudiante-id">ID del Estudiante</label>
                            <input id="estudiante-id" type="text" readonly>
                        </div>

                        <div class="field">
                            <label for="nombre">Nombre</label>
                            <input id="nombre" type="text" maxlength="80" pattern="[^0-9]+" data-validation="letters" required>
                        </div>

                        <div class="field">
                            <label for="apellido-paterno">Apellido paterno</label>
                            <input id="apellido-paterno" type="text" maxlength="80" pattern="[^0-9]+" data-validation="letters" required>
                        </div>

                        <div class="field">
                            <label for="apellido-materno">Apellido materno</label>
                            <input id="apellido-materno" type="text" maxlength="80" pattern="[^0-9]+" data-validation="letters" required>
                        </div>

                        <div class="field">
                            <label for="dni">DNI</label>
                            <div class="field-control-row">
                                <input id="dni" type="text" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" data-validation="dni" required>
                                <button type="button" class="btn btn-sec" id="btn-buscar-reniec">
                                    <span class="material-symbols-outlined">manage_search</span>Buscar en RENIEC
                                </button>
                            </div>
                            <small>Simulación local: usa uno de los DNI de demostración.</small>
                        </div>

                        <div class="field">
                            <label for="fecha-nacimiento">Fecha de nacimiento</label>
                            <input id="fecha-nacimiento" type="date" required>
                        </div>

                        <div class="field">
                            <label for="edad">Edad</label>
                            <input id="edad" type="number" min="3" max="25" readonly>
                        </div>

                        <div class="field">
                            <label for="sexo">Sexo</label>
                            <select id="sexo" required>
                                <option value="">Seleccione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                            </select>
                        </div>

                        <div class="field full-width">
                            <label for="historial-enfermedades">Historial de enfermedades</label>
                            <textarea id="historial-enfermedades" rows="3" maxlength="300" placeholder="Ej. Asma, alergias, etc."></textarea>
                        </div>

                        <div class="field">
                            <label for="celular">Celular</label>
                            <input id="celular" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" data-validation="phone">
                        </div>

                        <div class="field">
                            <label for="lugar-procedencia">Lugar de procedencia</label>
                            <input id="lugar-procedencia" type="text" maxlength="120" pattern="[^0-9]+" data-validation="letters">
                        </div>

                        <div class="field">
                            <label for="codigo-modular">Código modular</label>
                            <input id="codigo-modular" type="text" required>
                        </div>

                        <div class="academic-section-title">
                            <h3>Asignación académica</h3>
                            <p>Selecciona el grado y la sección donde se matriculará el estudiante.</p>
                        </div>

                        <div class="field">
                            <label for="grado">Grado</label>
                            <select id="grado" required>
                                <option value="">Seleccione un grado</option>
                                <option value="1°">1°</option>
                                <option value="2°">2°</option>
                                <option value="3°">3°</option>
                                <option value="4°">4°</option>
                                <option value="5°">5°</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="seccion">Sección</label>
                            <select id="seccion" required>
                                <option value="A">A</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="reset" class="btn btn-sec">Limpiar</button>
                        <button type="submit" class="btn btn-pri">Guardar estudiante</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        function calcularEdad(fechaNacimiento) {
            if (!fechaNacimiento) return '';
            const hoy = new Date();
            const nacimiento = new Date(fechaNacimiento);
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            const m = hoy.getMonth() - nacimiento.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
                edad--;
            }
            return edad;
        }

        function generarSiguienteId(prefijo, clave) {
            const registros = JSON.parse(localStorage.getItem(clave) || '[]');
            const maxNumero = registros.reduce((max, item) => {
                const match = String(item.id || '').match(/(\d+)/);
                const numero = match ? Number(match[1]) : 0;
                return Math.max(max, numero);
            }, 0);
            const siguiente = registros.length ? maxNumero + 1 : 0;
            return prefijo + String(siguiente).padStart(4, '0');
        }

        function inicializarFormulario() {
            const idInput = document.getElementById('estudiante-id');
            idInput.value = generarSiguienteId('E', 'jcm_demo_estudiantes');

            const fn = document.getElementById('fecha-nacimiento');
            const edad = document.getElementById('edad');
            fn.addEventListener('change', () => {
                edad.value = calcularEdad(fn.value);
            });

            const grado = document.getElementById('grado');
            const seccion = document.getElementById('seccion');
            grado.addEventListener('change', () => {
                const seccionAnterior = seccion.value;
                const opciones = grado.value === '2°' ? ['A', 'B'] : ['A'];
                seccion.replaceChildren(...opciones.map((opcion) => new Option(opcion, opcion)));
                seccion.value = opciones.includes(seccionAnterior) ? seccionAnterior : 'A';
            });
        }

        function buscarEnReniecSimulado() {
            const dniInput = document.getElementById('dni');
            const dni = dniInput.value.trim();
            if (!/^[0-9]{8}$/.test(dni)) {
                mostrarToast('Ingresa un DNI de 8 dígitos para realizar la búsqueda simulada.', 'warn');
                dniInput.focus();
                return;
            }

            const registrosDemo = {
                '73428190': { nombre: 'Diego', apellidoPaterno: 'Tantaleán', apellidoMaterno: 'Campos', fechaNacimiento: '2015-06-12', sexo: 'Masculino' },
                '71984322': { nombre: 'Lucas', apellidoPaterno: 'Bustamante', apellidoMaterno: 'Rojas', fechaNacimiento: '2014-11-18', sexo: 'Masculino' },
                '78811294': { nombre: 'Juan Esteban', apellidoPaterno: 'Vásquez', apellidoMaterno: 'Su', fechaNacimiento: '2012-03-11', sexo: 'Masculino' },
                '74569831': { nombre: 'Andrea', apellidoPaterno: 'Díaz', apellidoMaterno: 'Ramirez', fechaNacimiento: '2013-07-09', sexo: 'Femenino' }
            };
            const persona = registrosDemo[dni];
            if (!persona) {
                mostrarToast('No se encontró ese DNI en los datos de demostración de RENIEC.', 'warn');
                return;
            }

            document.getElementById('nombre').value = persona.nombre;
            document.getElementById('apellido-paterno').value = persona.apellidoPaterno;
            document.getElementById('apellido-materno').value = persona.apellidoMaterno;
            document.getElementById('fecha-nacimiento').value = persona.fechaNacimiento;
            document.getElementById('edad').value = calcularEdad(persona.fechaNacimiento);
            document.getElementById('sexo').value = persona.sexo;
            mostrarToast('Búsqueda completada y datos autocompletados. Simulación local: no se consultó RENIEC.', 'ok');
        }

        document.addEventListener('DOMContentLoaded', () => {
            inicializarFormulario();

            document.getElementById('btn-buscar-reniec').addEventListener('click', buscarEnReniecSimulado);

            const form = document.getElementById('form-estudiante');
            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const dni = document.getElementById('dni').value.trim();
                const celular = document.getElementById('celular').value.trim();
                if (!/^[0-9]{8}$/.test(dni)) {
                    mostrarToast('El DNI debe tener 8 dígitos.', 'error');
                    return;
                }

                if (celular && !/^[0-9]{9}$/.test(celular)) {
                    mostrarToast('El celular debe tener 9 dígitos.', 'error');
                    return;
                }

                const gradoSeleccionado = document.getElementById('grado').value;
                const seccionSeleccionada = document.getElementById('seccion').value;
                const datosInstitucionales = leerDatos();
                const aforoSeccion = datosInstitucionales.aforo.find((item) =>
                    item.seccion === `${gradoSeleccionado} ${seccionSeleccionada}`
                );
                if (!aforoSeccion) {
                    mostrarToast('No se encontró la capacidad configurada para esta sección.', 'error');
                    return;
                }
                if (Number(aforoSeccion.matriculados) >= Number(aforoSeccion.capacidad)) {
                    mostrarToast(`La sección ${aforoSeccion.seccion} está llena. No se puede registrar otra matrícula.`, 'warn');
                    return;
                }

                const estudiante = {
                    id: document.getElementById('estudiante-id').value,
                    nombre: document.getElementById('nombre').value.trim(),
                    apellidoPaterno: document.getElementById('apellido-paterno').value.trim(),
                    apellidoMaterno: document.getElementById('apellido-materno').value.trim(),
                    dni,
                    fechaNacimiento: document.getElementById('fecha-nacimiento').value,
                    edad: Number(document.getElementById('edad').value || 0),
                    sexo: document.getElementById('sexo').value,
                    historialEnfermedades: document.getElementById('historial-enfermedades').value.trim(),
                    celular,
                    lugarProcedencia: document.getElementById('lugar-procedencia').value.trim(),
                    codigoModular: document.getElementById('codigo-modular').value,
                    grado: gradoSeleccionado,
                    seccion: seccionSeleccionada,
                    aforoContabilizado: true
                };

                const registros = JSON.parse(localStorage.getItem('jcm_demo_estudiantes') || '[]');
                const matriculas = JSON.parse(localStorage.getItem('jcm_demo_matriculas') || '[]');
                if (!Array.isArray(registros) || !Array.isArray(matriculas)) {
                    mostrarToast('No se pudieron cargar las listas de estudiantes y matrículas.', 'error');
                    return;
                }

                const matriculaNumero = matriculas.reduce((max, matricula) => {
                    const match = String(matricula.idMatricula || '').match(/^M(\d+)-/);
                    return Math.max(max, match ? Number(match[1]) : 0);
                }, 0) + 1;
                const fechaActual = new Date();
                const matricula = {
                    idMatricula: `M${String(matriculaNumero).padStart(4, '0')}-${fechaActual.getFullYear()}`,
                    estudianteId: estudiante.id,
                    fechaMatricula: `${fechaActual.getFullYear()}-${String(fechaActual.getMonth() + 1).padStart(2, '0')}-${String(fechaActual.getDate()).padStart(2, '0')}`,
                    anioLectivo: String(fechaActual.getFullYear()),
                    estado: 'Pendiente',
                    observacion: ''
                };
                const estudiantesActualizados = [...registros, estudiante];
                const matriculasActualizadas = [...matriculas, matricula];
                const aforoAnterior = Number(aforoSeccion.matriculados);
                aforoSeccion.matriculados = aforoAnterior + 1;
                const estudiantesGuardados = localStorage.getItem('jcm_demo_estudiantes');
                const matriculasGuardadas = localStorage.getItem('jcm_demo_matriculas');
                const datosGuardados = localStorage.getItem(APP.claveDatos);
                try {
                    localStorage.setItem('jcm_demo_estudiantes', JSON.stringify(estudiantesActualizados));
                    localStorage.setItem('jcm_demo_matriculas', JSON.stringify(matriculasActualizadas));
                    if (!guardarDatos(datosInstitucionales)) throw new Error('No se pudo actualizar el aforo de la sección.');
                } catch (error) {
                    try {
                        if (estudiantesGuardados === null) localStorage.removeItem('jcm_demo_estudiantes');
                        else localStorage.setItem('jcm_demo_estudiantes', estudiantesGuardados);
                        if (matriculasGuardadas === null) localStorage.removeItem('jcm_demo_matriculas');
                        else localStorage.setItem('jcm_demo_matriculas', matriculasGuardadas);
                        if (datosGuardados === null) localStorage.removeItem(APP.claveDatos);
                        else localStorage.setItem(APP.claveDatos, datosGuardados);
                    } catch (rollbackError) {
                        console.error('No se pudo revertir parcialmente el guardado de matrícula.', rollbackError);
                    }
                    console.error('No se pudieron guardar el estudiante y su matrícula.', error);
                    mostrarToast('No se pudo guardar el estudiante y su matrícula en este navegador.', 'error');
                    return;
                }

                mostrarToast('Estudiante registrado correctamente.', 'ok');
                form.reset();
                document.getElementById('estudiante-id').value = generarSiguienteId('E', 'jcm_demo_estudiantes');
                document.getElementById('edad').value = '';
            });
        });
    </script>
</body>
</html>
