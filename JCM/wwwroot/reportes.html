<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - I.E. José Carlos Mariátegui</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">

    <style>
        .reportes {
            padding-bottom: 35px;
        }

            .reportes h2 {
                color: var(--primary);
                margin-bottom: 6px;
            }

        .descripcion {
            color: #647067;
            margin-bottom: 22px;
        }

        .opciones-reportes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .opcion-reporte {
            background: white;
            border: 1px solid #e0e6dc;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            cursor: pointer;
            transition: .2s;
        }

            .opcion-reporte:hover,
            .opcion-reporte.activo {
                border: 2px solid var(--primary-container);
                background: #f0f7ed;
                transform: translateY(-2px);
            }

            .opcion-reporte .icono {
                background: #e5f2e3;
                color: var(--primary-container);
                width: 45px;
                height: 45px;
                border-radius: 10px;
                display: grid;
                place-items: center;
                margin-bottom: 12px;
            }

                .opcion-reporte .icono span {
                    font-size: 27px;
                }

            .opcion-reporte h3 {
                margin: 0 0 7px;
                font-size: 16px;
                color: #183b24;
            }

            .opcion-reporte p {
                color: #68736a;
                font-size: 13px;
                margin: 0;
            }

        .panel-reporte {
            background: white;
            border: 1px solid #e1e7dc;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .panel-titulo {
            background: var(--primary-container);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .filtros {
            padding: 22px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
        }

            .filtros label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #36533d;
                margin-bottom: 7px;
            }

            .filtros select,
            .filtros input {
                width: 100%;
                padding: 11px;
                border: 1px solid #cbd5c7;
                border-radius: 7px;
                background: white;
                font: inherit;
            }

        .acciones {
            padding: 0 22px 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-reporte {
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            background: #f59e0b;
            color: #172033;
            font-weight: 700;
            cursor: pointer;
        }

            .btn-reporte:hover {
                background: #e58b00;
            }

        .btn-secundario {
            border: 1px solid #cbd5c7;
            background: white;
            color: #24452b;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .resultado {
            background: white;
            border: 1px solid #e1e7dc;
            border-radius: 12px;
            padding: 22px;
            overflow-x: auto;
        }

            .resultado h3 {
                color: var(--primary);
                margin-top: 0;
            }

        .tabla-reporte {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

            .tabla-reporte th {
                background: #e9f2e6;
                color: #24452b;
                text-align: left;
                padding: 12px;
            }

            .tabla-reporte td {
                border-bottom: 1px solid #e5e9e2;
                padding: 12px;
            }

        .vacio {
            color: #758078;
            text-align: center;
            padding: 25px;
        }

        @media(max-width: 850px) {
            .opciones-reportes {
                grid-template-columns: 1fr;
            }

            .filtros {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            .sidebar, .topbar, .opciones-reportes,
            .panel-reporte, .aviso-demo {
                display: none !important;
            }

            .resultado {
                border: none;
            }
        }
    </style>
</head>

<body data-page="reportes">

    <main class="content reportes" id="contenido">

        <div class="cabecera-pagina">
            <h2>Reportes y estadísticas</h2>
        </div>

        <p class="descripcion">
            Consulta, filtra y genera reportes de matrícula y documentos recibidos de la institución.
        </p>

        <section class="opciones-reportes">

            <button class="opcion-reporte activo" data-tipo="matricula">
                <div class="icono">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <h3>Reporte de matrículas</h3>
                <p>Consulta estudiantes por año, grado y sección.</p>
            </button>

            <button class="opcion-reporte" data-tipo="documentos">
                <div class="icono">
                    <span class="material-symbols-outlined">folder_open</span>
                </div>
                <h3>Documentos recibidos</h3>
                <p>Consulta los documentos ingresados a la institución.</p>
            </button>

            <button class="opcion-reporte" data-tipo="consolidado">
                <div class="icono">
                    <span class="material-symbols-outlined">analytics</span>
                </div>
                <h3>Consolidado general</h3>
                <p>Resumen general de matrículas y trámites.</p>
            </button>

        </section>

        <section class="panel-reporte">

            <div class="panel-titulo">
                <span class="material-symbols-outlined">filter_alt</span>
                <span id="titulo-filtro">Filtros del reporte de matrícula</span>
            </div>

            <div class="filtros">

                <div>
                    <label for="anio">Año académico</label>
                    <select id="anio">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>

                <div id="filtro-grado">
                    <label for="grado">Grado</label>
                    <select id="grado">
                        <option value="Todos">Todos</option>
                        <option value="1°">1°</option>
                        <option value="2°">2°</option>
                        <option value="3°">3°</option>
                        <option value="4°">4°</option>
                        <option value="5°">5°</option>
                    </select>
                </div>

                <div id="filtro-seccion">
                    <label for="seccion">Sección</label>
                    <select id="seccion">
                        <option value="Todas">Todas</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                    </select>
                </div>

                <div id="filtro-fecha" hidden>
                    <label for="fecha">Fecha de recepción</label>
                    <input type="date" id="fecha">
                </div>

                <div id="filtro-tipo" hidden>
                    <label for="tipo-documento">Tipo de documento</label>
                    <select id="tipo-documento">
                        <option value="Todos">Todos</option>
                        <option value="Solicitud">Solicitud</option>
                        <option value="Constancia">Constancia</option>
                        <option value="Certificado">Certificado</option>
                    </select>
                </div>

            </div>

            <div class="acciones">
                <button class="btn-reporte" id="generar">
                    <span class="material-symbols-outlined">search</span>
                    Generar reporte
                </button>

                <button class="btn-secundario" id="limpiar">
                    Limpiar filtros
                </button>
            </div>

        </section>

        <section class="resultado" id="resultado" aria-live="polite">
            <h3>Resultado del reporte</h3>
            <p class="vacio">Selecciona los filtros y presiona «Generar reporte».</p>
        </section>

        <div class="acciones">
            <button class="btn-secundario" id="descargar-pdf">
                <span class="material-symbols-outlined">picture_as_pdf</span>
                Descargar PDF
            </button>

            <button class="btn-secundario" id="descargar-excel">
                <span class="material-symbols-outlined">table_view</span>
                Descargar Excel
            </button>
        </div>

    </main>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/reportes.js"></script>

</body>
</html>
