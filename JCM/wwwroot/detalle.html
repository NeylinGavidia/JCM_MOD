<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del expediente - Mesa de Partes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body data-page="tramites">
    <main class="content" id="contenido">
        <div class="page-shell">
            <div class="module-title-row">
                <div class="module-copy">
                    <h2>Detalle del expediente</h2>
                    <p>Consulta los datos del documento y actualiza su estado y seguimiento.</p>
                </div>
            </div>
            <div class="module-actions">
                <a class="btn btn-sec" href="tramites.html"><span class="material-symbols-outlined">arrow_back</span>Volver a trámites</a>
            </div>
            <div id="detalle-expediente" class="form-grid"></div>
            <form id="form-seguimiento" class="form-section" novalidate>
                <h3 class="form-section-title">Observaciones y seguimiento</h3>
                <label class="field" for="estado-seguimiento">Estado actual
                    <select class="form-control" id="estado-seguimiento" required>
                        <option>Registrado</option>
                        <option>Pendiente</option>
                        <option>En revisión</option>
                        <option>Atendido</option>
                        <option>Observado</option>
                    </select>
                </label>
                <label class="field" for="observacion-seguimiento">Observación
                    <textarea class="form-control" id="observacion-seguimiento" rows="4" maxlength="500" placeholder="Escribe una nota de seguimiento (opcional)"></textarea>
                </label>
                <div class="form-actions">
                    <button type="submit" class="btn btn-pri">Guardar cambios</button>
                </div>
            </form>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
